<!DOCTYPE html>
<html>
<head>
<title>Calculator</title>
<style>
html, body{
    height:100%;
    margin:0;
    background-color:#e6ecff;
}

.page{
    height:100%;
    display:flex;
    flex-direction:column;
}

h1{
    text-align:center;
    margin-top:20px;
}

.container{
    display:flex;
    justify-content:center;
    align-items:center;
}

.calculator{
    width:90%;
    padding:30px;
    max-width:400px;
    border:2px solid #000;
    border-radius:10px;
    background-color:#acc5ff;
}

#display{
    width:100%;
    height:60px;
    font-size:24px;
    margin-bottom:15px;
}

button{
    width:20%;
    height:60px;
    font-size:20px;
    margin:5px;
    border-radius:8px;
    cursor:pointer;
}

.num{
    background-color:#d6c7f2; 
}
.op{ 
    background-color:#ffd27f; 
}
.calculate{ 
    background-color:#4caf50; 
    color:white; 
}
.clear{ 
    background-color:#ff5c5c; 
    color:white; 
}    
</style>
</head>

<body>

<div class="page">
    <h1>Simple Calculator</h1>

    <div class="container">
        <div class="calculator">
            <input type="text" id="display" readonly>
            <br><br>
            <button class="num" onclick="press('7')">7</button>
            <button class="num" onclick="press('8')">8</button>
            <button class="num" onclick="press('9')">9</button><br>
            <button class="num" onclick="press('4')">4</button>
            <button class="num" onclick="press('5')">5</button>
            <button class="num" onclick="press('6')">6</button><br>
            <button class="num" onclick="press('1')">1</button>
            <button class="num" onclick="press('2')">2</button>
            <button class="num" onclick="press('3')">3</button><br>
            <button class="num" onclick="press('0')">0</button><br>
            <button class="op" onclick="press('+')">+</button>
            <button class="op" onclick="press('-')">-</button>
            <button class="op" onclick="press('*')">*</button><br>
            <button class="op" onclick="press('/')">/</button>
            <button class="op" onclick="press('**')">pow</button>
            <button class="op" onclick="press('%')">%</button><br>
            <button class="calculate" onclick="calculate()">=</button>
            <button class="clear" onclick="clearDisplay()">Clear</button>
        </div>
    </div>
</div>

<script>
function press(value){
    document.getElementById('display').value += value;
}   
function calculate(){
    document.getElementById('display').value =
    eval(document.getElementById('display').value);
}
function clearDisplay(){
    document.getElementById('display').value = '';
}
</script>

</body>
</html>
