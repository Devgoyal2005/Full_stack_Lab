<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>
    <style>
        body {
            text-align: center;
            margin: auto;
            padding: 50px;
            background-color: whitesmoke;
        }
        h2 {
            margin: auto;
            padding: 50px;
        }
        #time {
            font-size: 50px;
            margin: auto;            
            padding: 50px;
        }
        #box{
            border: 2px solid;
            padding: 20px;
            height: 40%;
            width: 50%;
            margin: auto;
            background-color: lightcyan;
        }
        #display {
            border: 1px solid;
            background-color: white;
            padding: 20px;
            height: 20%;
            width: 60%;
            border-radius: 10px;;
            margin: auto;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="box">
        <h1>Stopwatch</h1>
        <div id="display">
            <h1 id="time"><i>0</i></h1>
        </div>
        <button onclick="start()" style="background-color: green;">START</button>
        <button onclick="pause()" style="background-color: orange;">PAUSE</button>
        <button onclick="reset()" style="background-color: red;">RESET</button>
    </div>
    <script>
        let count = 0;
        let timer = null;
        function updateTime() {
            count++;
            document.getElementById("time").innerHTML = "<i>" + count + "</i>";
        }
        function start() {
            timer = setInterval(updateTime, 1000);
        }
        function pause() {
            clearInterval(timer);
        }
        function reset() {
            clearInterval(timer);
            count = 0;
            document.getElementById("time").innerText = "0";
        }
    </script>
</body>
</html>
